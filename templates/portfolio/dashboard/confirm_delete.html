{% extends 'portfolio/dashboard/base_dashboard.html' %}

{% block dashboard_content %}
<h1>Confirm Delete</h1>
<p class="dash-sub">Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>

<form method="post" class="dash-form">
    {% csrf_token %}
    <div class="dash-actions">
        <button type="submit" class="btn btn-primary danger">Yes, Delete</button>
        {% if cancel_kwargs %}
        <a href="{% url cancel_url model_name=cancel_kwargs.model_name %}" class="btn btn-outline">Cancel</a>
        {% else %}
        <a href="{% url cancel_url %}" class="btn btn-outline">Cancel</a>
        {% endif %}
    </div>
</form>
{% endblock %}
